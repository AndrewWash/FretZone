<section class="tn-card" aria-label="Tuner">
  <div class="tn-head">
    <div class="tn-titles">
      <h2 class="tn-title">Tuner</h2>
      <p class="tn-sub">Calibrate your instrument. A4 is shared with the Fretboard Quiz.</p>
    </div>
    <span class="tn-badge"
          [class.is-live]="running()"
          [class.is-tuned]="inTune() && running()"
          role="status"
          aria-live="polite">
      {{ statusBadge() }}
    </span>
  </div>

  <div class="tn-stage"
       [class.is-active]="running() && hasReading()"
       [class.is-tuned]="inTune() && running()">
    <div class="tn-note" aria-label="Detected note">{{ note() }}</div>
    <div class="tn-freq">{{ hzText() }}</div>

    <div class="tn-meter"
         role="meter"
         aria-label="Cents off pitch"
         aria-valuemin="-50"
         aria-valuemax="50"
         [attr.aria-valuenow]="cents()">
      <div class="tn-meter-track" aria-hidden="true">
        <div class="tn-meter-zone"></div>
        <span class="tn-meter-tick tn-meter-tick--minor" style="left: 10%"></span>
        <span class="tn-meter-tick tn-meter-tick--minor" style="left: 30%"></span>
        <span class="tn-meter-tick tn-meter-tick--center" style="left: 50%"></span>
        <span class="tn-meter-tick tn-meter-tick--minor" style="left: 70%"></span>
        <span class="tn-meter-tick tn-meter-tick--minor" style="left: 90%"></span>
        @if (hasReading()) {
          <span class="tn-meter-needle"
                [style.left.%]="meterOffsetPct()"
                [class.is-tuned]="inTune()"></span>
        }
      </div>
      <div class="tn-meter-scale" aria-hidden="true">
        <span>−50</span>
        <span>−25</span>
        <span class="tn-meter-scale-mid">0</span>
        <span>+25</span>
        <span>+50</span>
      </div>
    </div>

    <div class="tn-cents" aria-hidden="true">
      <span class="tn-cents-value">{{ centsText() }}</span>
      <span class="tn-cents-unit">cents</span>
    </div>
  </div>

  @if (error(); as err) {
    <p class="tn-error" role="alert">{{ err }}</p>
  }

  <div class="tn-controls">
    <div class="tn-controls-buttons">
      <button (click)="onStart()" [disabled]="running()">Start Mic</button>
      <button class="secondary" (click)="onStop()" [disabled]="!running()">Stop</button>
    </div>
    <label class="tn-a4">
      <span class="tn-a4-lbl">A4 (Hz)</span>
      <input type="number" min="400" max="480" step="0.1" [formControl]="a4Ctrl" class="tn-a4-input" />
    </label>
  </div>
</section>
