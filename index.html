<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FretZone</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { height: 100%; margin: 0; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#0f172a; color:#e2e8f0; }
    a { color: #93c5fd; }
    .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
    header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    header h1 { font-size: 22px; margin: 0; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; box-shadow: 0 6px 24px rgba(0,0,0,0.25); }
    .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
    .row > * { flex: 1 1 auto; }
    button { background:#2563eb; color:#fff; border:0; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:600; }
    button.secondary { background:#334155; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .pill { padding:6px 10px; border:1px solid #334155; border-radius:999px; font-size:12px; }
    .hidden { display:none !important; }
    .mt-2 { margin-top: 12px; }
    .mt-3 { margin-top: 18px; }
    .mt-4 { margin-top: 24px; }
    .grid { display:grid; gap:12px; }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    @media (max-width: 720px) { .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
